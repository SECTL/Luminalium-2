name: Nightly Prerelease

# 每天自动构建一个**预发布（Nightly）**版本并发布到 Releases。
#
# 流程：
#   1. 算版本号 —— 基准版本（app/__init__.py）拼上当天日期，得
#      ``26.0.707.1-nightly.20261005``，并在打包前写回 app/__init__.py，
#      让 exe 内报的版本号就是它；
#   2. QML 编译自检 —— 不过就拦下，宁可不发也不发坏包；
#   3. 打包 —— 同时出**单文件 exe** 与**目录版 zip**；
#   4. 发布 —— 建 GitHub Pre-release，说明里贴头图
#      （docs/NewVersionUpdate-Banner.png）、列出本次与**上一个 nightly** 之间的
#      提交，并写明这是测试版、遇到问题怎么上报、上报时要带哪些诊断信息。
#
# ⚠️ GitHub 的 cron 只认 UTC。18:00 UTC = 次日 02:00（北京），所以「北京今天」
#    对应的是前一个 UTC 日的 18:00。

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 即使自上个 nightly 以来没有新提交，也照常构建并发布
        type: boolean
        default: false

# 建 release / 推 tag 都要写权限。
permissions:
  contents: write

# 同一时间只跑一个 nightly；不取消正在跑的（半截的构建不如让它跑完）。
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  # 发布说明顶部那张头图，在仓库里的相对路径。
  BANNER_PATH: docs/NewVersionUpdate-Banner.png

jobs:
  nightly:
    name: 构建并发布 Nightly
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # fetch-depth: 0 是**必须的** —— 生成「本次与上个 nightly 之间的提交」要完整
      # 历史与全部 tag，浅克隆拿不到。
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10"

      # 先算版本号、改 app/__init__.py、生成发布说明与 exe 版本资源。
      # 后面的步骤靠这里的 outputs 决定发不发。
      - name: 计算版本号并生成发布说明
        id: meta
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: python .github/scripts/nightly_release.py

      # 头图缺失的话，发布说明里会是一张裂图 —— 提前拦下。
      - name: 检查头图是否存在
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          if [ ! -f "${BANNER_PATH}" ]; then
            echo "::error::缺少头图 ${BANNER_PATH}（发布说明要贴它），请先提交该文件"
            exit 1
          fi

      # 只编译、不实例化，纯静态检查（tools/check_qml.py）。offscreen 平台插件
      # 让它在无显示器的 runner 上也能跑。
      - name: QML 编译自检
        if: steps.meta.outputs.should_publish == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_qml.py

      # ---- 单文件 exe ----
      - name: 打包（单文件）
        if: steps.meta.outputs.should_publish == 'true'
        env:
          LUMINALIUM_ONEFILE: "1"
          LUMINALIUM_VERSION_FILE: ${{ steps.meta.outputs.version_file }}
        run: >
          python -m PyInstaller --noconfirm --clean
          --distpath dist/onefile --workpath build/onefile
          Luminalium.spec

      # ---- 目录版 ----
      - name: 打包（目录版）
        if: steps.meta.outputs.should_publish == 'true'
        env:
          LUMINALIUM_VERSION_FILE: ${{ steps.meta.outputs.version_file }}
        run: >
          python -m PyInstaller --noconfirm --clean
          --distpath dist/onedir --workpath build/onedir
          Luminalium.spec

      - name: 收集产物
        if: steps.meta.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "dist/onefile/Luminalium2.exe" "artifact/Luminalium2-$v.exe"
          Compress-Archive -Path "dist/onedir/Luminalium2/*" `
            -DestinationPath "artifact/Luminalium2-$v-win-x64.zip" -Force
          Get-ChildItem artifact | Select-Object Name, Length

      - name: 发布 GitHub 预发布
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 同一天重跑：先把旧的 release / tag 清掉再重建（nightly 允许覆盖）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" artifact/* \
            --title "Luminalium 2 ${{ steps.meta.outputs.version }} (Nightly)" \
            --notes-file "${{ steps.meta.outputs.notes_file }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --latest=false

      - name: 跳过发布（自上个 nightly 以来无新提交）
        if: steps.meta.outputs.should_publish != 'true'
        shell: bash
        run: |
          echo "::notice::自上个 nightly（${{ steps.meta.outputs.prev_tag }}）以来没有新提交，已跳过本次发布。"
          echo "如需强制发布，请用 workflow_dispatch 并勾选 force。"

      - name: 写入运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## Nightly 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 基准版本 | \`${{ steps.meta.outputs.base_version }}\` |"
            echo "| Tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| 上一个 nightly | \`${{ steps.meta.outputs.prev_tag }}\` |"
            echo "| 提交数 | ${{ steps.meta.outputs.commit_count }} |"
            echo "| 是否发布 | ${{ steps.meta.outputs.should_publish }} |"
          } >> "$GITHUB_STEP_SUMMARY"
