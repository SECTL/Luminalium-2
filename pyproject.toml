[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luminalium"
# 版本号不在这里维护：dynamic + 下面的 [tool.hatch.version] 让 hatchling 直接
# 读 app/__init__.py 的 __version__（格式 = AGENTS.md 里的「年份.中版本.小版本.
# 状态」，最后一位 1=开发版）。发版只改那一个地方，这份文件不会再脱节。
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.9",
    "RinUI>=0.4.4",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
luminalium2 = "app.application:main"

[tool.hatch.version]
# hatchling 不 import 这个文件，只按正则抠 __version__，所以 app/__init__.py
# 顶部的那些注释不影响解析。
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"ui" = "ui"
"assets" = "assets"
"config" = "config"
